name: Validate Career Pipeline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'modules/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/keywords.json'
      - 'config/settings.json'
      - 'README.md'
      - '.gitignore'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'modules/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/keywords.json'
      - 'config/settings.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install validation modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -MaximumVersion 1.99.99
          Install-Module Pester -Scope CurrentUser -Force -MaximumVersion 5.99.99 -SkipPublisherCheck

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem modules,scripts,tests -Recurse -Include *.ps1,*.psm1
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($file.FullName): $($_.Message)" }
            }
          }
          if ($failed) { throw 'PowerShell parser validation failed.' }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $issues = @()
          foreach ($path in @('modules','scripts')) {
            $issues += Invoke-ScriptAnalyzer -Path $path -Recurse -Severity Error
          }
          if ($issues) {
            $issues | Format-Table -AutoSize | Out-String | Write-Host
            throw 'PSScriptAnalyzer reported errors.'
          }

      - name: Validate JSON
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem config,data -Recurse -Filter *.json | ForEach-Object {
            Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null
            Write-Host "Valid JSON: $($_.FullName)"
          }

      - name: Run Pester
        shell: pwsh
        run: |
          Import-Module Pester -MaximumVersion 5.99.99 -Force
          $result = Invoke-Pester -Path tests -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester test(s) failed." }
